<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Verificación de sellado offline</title>
<body><p id="status">Cargando módulos</p>
<script type="module">
import { OfflineDatabase } from '../../src/offline/offline-database.ts';
import { OfflineKeys } from '../../src/offline/offline-keys.ts';
import { OfflineLease } from '../../src/offline/offline-lease.ts';
import { OfflineSealer } from '../../src/offline/offline-sealer.ts';
import { base64, bytes } from '../../src/offline/offline-crypto.ts';
const org = '11111111-1111-4111-8111-111111111111';
const device = '22222222-2222-4222-8222-222222222222';
const alice = '33333333-3333-4333-8333-333333333333';
const bob = '44444444-4444-4444-8444-444444444444';
const db = new OfflineDatabase(org, device);
const keys = new OfflineKeys(db);
const lease = new OfflineLease(db);
let sealer;
const input = userId => ({ userId, sessionId: `session-${userId}`, kind: 'sale', payload: { amount: '10.00' },
  grant: { version: 1 }, configVersion: '1', occurredAt: '2026-10-06T12:00:00.000Z' });
async function configure() {
  const config = JSON.parse(localStorage.getItem('offline-harness-publication'));
  const publicKey = await crypto.subtle.importKey('spki', bytes(Uint8Array.from(atob(config.spki), c => c.charCodeAt(0))),
    { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  sealer = new OfflineSealer(db, keys, lease, { certificate: 'opaque-certificate', publication: config.publication,
    trustedSigner: publicKey, trustedSigningKeyId: 'trusted' });
}
window.harness = {
  async initialize() {
    await db.delete();
    await db.open();
    await keys.create(alice, 'long-pin-alice');
    const signer = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
    const rsa = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 3072,
      publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, false, ['wrapKey', 'unwrapKey']);
    const payload = JSON.stringify({ version: 1, keyId: 'key', algorithm: 'RSA-OAEP-3072/SHA-256',
      publicKey: `-----BEGIN PUBLIC KEY-----\n${base64(new Uint8Array(await crypto.subtle.exportKey('spki', rsa.publicKey)))}\n-----END PUBLIC KEY-----` });
    const publication = { payload, signingKeyId: 'trusted', signature: base64(new Uint8Array(await crypto.subtle.sign(
      { name: 'ECDSA', hash: 'SHA-256' }, signer.privateKey, bytes(new TextEncoder().encode(payload))))) };
    localStorage.setItem('offline-harness-publication', JSON.stringify({ publication,
      spki: base64(new Uint8Array(await crypto.subtle.exportKey('spki', signer.publicKey))) }));
    await configure();
  },
  async resume() { await db.open(); await configure(); await keys.unlock(alice, 'long-pin-alice'); },
  seal: () => sealer.seal(input(alice)),
  lock: () => keys.lock(),
  async switchIdentity() { await keys.create(bob, 'long-pin-bob'); return sealer.seal(input(bob)); },
  pending: async () => (await db.deliveryBytes()).map(row => ({ id: row.id, envelope: base64(row.envelope) })),
  state: async () => ({ head: await db.meta.get('device-chain'), records: await db.records.count(), pending: await db.delivery_queue.count() }),
  async rollback() {
    const before = await db.meta.get('device-chain');
    const fail = () => { throw new Error('Write failed'); };
    db.delivery_queue.hook('creating', fail);
    try { await sealer.seal(input(alice)); throw new Error('Expected rollback'); }
    catch (error) { if (!error.message.includes('Write failed')) throw error; }
    finally { db.delivery_queue.hook('creating').unsubscribe(fail); }
    const after = await db.meta.get('device-chain');
    if (before.sequence !== after.sequence || before.headHash !== after.headHash) throw new Error('Partial commit');
  },
  acquire: (owner, duration) => lease.acquire(owner, duration),
  release: token => lease.release(token),
  assert: token => lease.assert(token),
};
document.getElementById('status').textContent = 'Listo';
</script></body></html>
