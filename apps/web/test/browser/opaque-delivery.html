<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de entrega opaca</title><body>
<script type="module">
import {OfflineDatabase} from '../../src/offline/offline-database.ts';
import {OfflineKeys} from '../../src/offline/offline-keys.ts';
import {OpaqueDelivery} from '../../src/offline/opaque-delivery.ts';
import {retireOfflineIdentity,observeIdentityRetirement} from '../../src/offline/offline-identity.ts';
import {OfflineRevocation} from '../../src/offline/offline-revocation.ts';
import {OfflineRecordCipher} from '../../src/offline/offline-record-cipher.ts';
const org='11111111-1111-4111-8111-111111111111',device='22222222-2222-4222-8222-222222222222';
const db=new OfflineDatabase(org,device),keys=new OfflineKeys(db),delivery=new OpaqueDelivery(db);
observeIdentityRetirement();
window.deliveryHarness={
 async initialize(){
  await db.delete();await db.open();await keys.create('alice','offline-pin');
  const {publicKey}=await (await fetch('/test-delivery/key')).json();
  const ack=await crypto.subtle.importKey('spki',Uint8Array.from(atob(publicKey),v=>v.charCodeAt(0)),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
  const device=await db.device_keys.get('device');await db.device_keys.put({...device,ackKeys:{'test-ack':ack}});
 },
 async enqueue(){const id=crypto.randomUUID();const envelope=new TextEncoder().encode(JSON.stringify({version:1,keyId:'retained',operationId:id,certificate:'opaque-test',ciphertext:'sealed'}));
  await keys.unlock('alice','offline-pin');
  const cipher=await new OfflineRecordCipher().encrypt(keys.dekFor('alice'),{organizationId:org,deviceId:device,userId:'alice',kind:'operation',id},new TextEncoder().encode('private-alice-content'));
  await db.enqueueOpaque(id,envelope);await db.putEncrypted('alice','operation',id,cipher);keys.lock();return id;},
 flush:()=>delivery.flush(),
 unlock:()=>keys.unlock('alice','offline-pin'),
 unlocked:()=>keys.canCreate(),
 revoke:()=>new OfflineRevocation(db,keys).learn(null),
 async retire(){await retireOfflineIdentity(db);let blocked=false;try{await keys.unlock('alice','offline-pin');}catch{blocked=true;}return {unlocked:keys.canCreate(),blocked};},
 async switchIdentity(){
  await retireOfflineIdentity(db);await keys.create('bob','other-pin');
  const row=(await db.records.toArray())[0];let denied=false,wrongKey=false;
  try{keys.dekFor('alice');}catch{denied=true;}
  try{await new OfflineRecordCipher().decrypt(keys.dekFor('bob'),{organizationId:org,deviceId:device,userId:'alice',kind:row.kind,id:row.id},row.ciphertext);}catch{wrongKey=true;}
  return {denied,wrongKey,ownRecords:await db.records.filter(record=>record.userId==='bob').count()};
 },
 state:async()=>({pending:(await db.deliveryBytes()).map(row=>({id:row.id,bytes:Array.from(row.envelope),ack:Boolean(row.ack)})),records:await db.records.count()}),
 async worker(){const registration=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;registration.active.postMessage({type:'uco:deliver'});},
 async reopen(){await db.open();keys.lock();},
};
</script></body></html>
