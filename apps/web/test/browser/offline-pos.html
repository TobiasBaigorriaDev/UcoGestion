<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Verificación de apertura POS offline</title>
<body><p id="status">Cargando módulos</p><script type="module">
import { OfflineConfigurationBarrier } from '../../src/offline/offline-configuration-barrier.ts';
import { OfflineCloseBarrier } from '../../src/offline/offline-close.ts';
import { OfflineRevocation } from '../../src/offline/offline-revocation.ts';
import { OfflineDatabase } from '../../src/offline/offline-database.ts';
import { OfflineKeys } from '../../src/offline/offline-keys.ts';
import { OfflineLease } from '../../src/offline/offline-lease.ts';
import { OfflineSealer } from '../../src/offline/offline-sealer.ts';
import { OfflineAuthorization } from '../../src/offline/offline-authorization.ts';
import { OfflinePos } from '../../src/offline/offline-pos.ts';
import { base64, bytes } from '../../src/offline/offline-crypto.ts';
const org = '11111111-1111-4111-8111-111111111111';
const device = '22222222-2222-4222-8222-222222222222';
const actor = '33333333-3333-4333-8333-333333333333';
const branch = '44444444-4444-4444-8444-444444444444';
const grantId = '55555555-5555-4555-8555-555555555555';
const register = '66666666-6666-4666-8666-666666666666';
const db = new OfflineDatabase(org, device);
const keys = new OfflineKeys(db);
let pos;
let currentAuthorization;
let envelopeFault = false;
db.delivery_queue.hook('creating', () => { if (envelopeFault) throw new Error('Injected envelope failure'); });
const url64 = data => base64(data).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
function der(raw) {
  const integers = [raw.slice(0, 32), raw.slice(32)].map(value => {
    while (value.length > 1 && value[0] === 0) value = value.slice(1);
    if (value[0] & 128) value = new Uint8Array([0, ...value]);
    return new Uint8Array([2, value.length, ...value]);
  });
  return new Uint8Array([48, integers[0].length + integers[1].length, ...integers[0], ...integers[1]]);
}
async function connect() {
  const fixture = JSON.parse(localStorage.getItem('pos-public-fixture'));
  const trusted = await crypto.subtle.importKey('jwk', fixture.trusted, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const authorization = new OfflineAuthorization(db, keys, trusted, 'trusted',
    () => sessionStorage.getItem('pos-test-clock') === null ? Date.now() : Number(sessionStorage.getItem('pos-test-clock')));
  const sealer = new OfflineSealer(db, keys, new OfflineLease(db), {
    certificate: 'opaque-test-certificate', publication: fixture.publication, trustedSigner: trusted, trustedSigningKeyId: 'trusted',
  });
  currentAuthorization=authorization;
  pos = new OfflinePos(db, keys, authorization, sealer);
  return authorization;
}
window.posHarness = {
  async initialize() {
    sessionStorage.removeItem('pos-test-clock');
    await db.delete(); await db.open(); await keys.create(actor, 'offline-pin');
    const signer = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
    const rsa = await crypto.subtle.generateKey({ name: 'RSA-OAEP', modulusLength: 3072,
      publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' }, false, ['wrapKey', 'unwrapKey']);
    const signing = async payload => new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, signer.privateKey,
      bytes(new TextEncoder().encode(payload))));
    const pem = async key => `-----BEGIN PUBLIC KEY-----\n${base64(new Uint8Array(await crypto.subtle.exportKey('spki', key)))}\n-----END PUBLIC KEY-----\n`;
    const ingestionPayload = JSON.stringify({ version: 1, keyId: 'ingestion', algorithm: 'RSA-OAEP-3072/SHA-256', publicKey: await pem(rsa.publicKey) });
    const publication = { payload: ingestionPayload, signature: base64(await signing(ingestionPayload)), signingKeyId: 'trusted' };
    const bootstrap = { version: 1, organizationId: org, deviceId: device, actorUserId: actor, branchId: branch, grantId,
      epoch: '1', configurationVersion: '1', role: 'OWNER', permissions: { canDiscount: true }, timezone: 'UTC',
      serverTime: new Date().toISOString(), stock: [], configuration: { currency: 'ARS', items: [{ id: org,
        name: 'Producto', sku: null, barcode: null, type: 'PRODUCT', baseUnit: 'UNIT',
        trackInventory: false, price: '10.00', priceVersion: 1 }], categories: [],
        branches: [{ id: branch, name: 'Main' }], cashRegisters: [{ id: register, name: 'Register', branchId: branch }], paymentMethods: ['CASH'] },
      ingestionKey: publication, ackKey: { algorithm: 'ES256', keyId: 'trusted', publicKeyPem: await pem(signer.publicKey) } };
    const payload = JSON.stringify(bootstrap);
    const signed = { payload, signature: base64(der(await signing(payload))), signingKeyId: 'trusted' };
    const iat = Math.floor(Date.now() / 1000);
    const deviceKey = await db.device_keys.get('device');
    const claims = { version: 1, grantId, organizationId: org, deviceId: device, actorUserId: actor, branchId: branch,
      epoch: '1', configurationVersion: '1', role: 'OWNER', permissions: { canDiscount: true }, cashRegisterIds: [register],
      thumbprint: url64(new Uint8Array(await crypto.subtle.digest('SHA-256', await crypto.subtle.exportKey('spki', deviceKey.publicKey)))),
      bootstrapHash: Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes(new TextEncoder().encode(payload)))),
        byte => byte.toString(16).padStart(2, '0')).join(''), iat, exp: iat + 72 * 60 * 60 };
    const header = url64(new TextEncoder().encode(JSON.stringify({ alg: 'ES256', kid: 'trusted', typ: 'uco-offline-grant+jwt' })));
    const body = url64(new TextEncoder().encode(JSON.stringify(claims)));
    const grant = `${header}.${body}.${url64(await signing(`${header}.${body}`))}`;
    // Only public cryptographic fixture material here; authorization is encrypted by production code.
    localStorage.setItem('pos-public-fixture', JSON.stringify({ trusted: await crypto.subtle.exportKey('jwk', signer.publicKey), publication, iat, exp:claims.exp }));
    await (await connect()).install(actor, signed, grant);
  },
  async resume() { await db.open(); await keys.unlock(actor, 'offline-pin'); await connect(); },
  freeze: id=>new OfflineConfigurationBarrier(db,currentAuthorization).freeze({id,epoch:1}),
  freezeClose: id=>new OfflineCloseBarrier(db).prepare(id),
  checkpoints: ()=>new OfflineConfigurationBarrier(db,currentAuthorization).checkpoints(),
  revoke: target=>new OfflineRevocation(db,keys).learn(target),
  open: () => pos.open(actor, { cashRegisterId: register, openingCash: '10.00' }),
  prepare: (sessionId, input = {}) => pos.prepareSale(actor, { sessionId, lines: [{ itemId: org, quantity: '1' }], ...input }),
  confirm: draftId => pos.confirmSale(actor, { draftId, payments: [{ method: 'CASH', appliedAmount: '10.00', receivedAmount: '15.00' }] }),
  fault: enabled => { envelopeFault = enabled; },
  catalog: () => pos.catalog(actor),
  lock: () => keys.lock(),
  expire: () => sessionStorage.setItem('pos-test-clock',String(JSON.parse(localStorage.getItem('pos-public-fixture')).exp*1000)),
  rewind: () => sessionStorage.setItem('pos-test-clock',String(JSON.parse(localStorage.getItem('pos-public-fixture')).iat*1000+1000)),
  state: async () => ({ head: await db.meta.get('device-chain'), records: await db.records.count(),
    pending: (await db.deliveryBytes()).map(row => ({ id: row.id, bytes: base64(row.envelope) })) }),
};
document.getElementById('status').textContent = 'Listo';
</script></body></html>
