<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Verificación de migración offline</title>
<body><p id="status">Cargando</p><script type="module">
import Dexie from 'dexie';
import { OfflineDatabase } from '../../src/offline/offline-database.ts';
import { prepareOfflineUpdate } from '../../src/offline/prepare-offline-update.ts';
const org = '11111111-1111-4111-8111-111111111111';
const device = '22222222-2222-4222-8222-222222222222';
const name = OfflineDatabase.nameFor(org, device);
window.migration = {
  async seed(version) {
    await Dexie.delete(name);
    const db = new Dexie(name);
    db.version(2).stores({ records: '[userId+kind+id]', delivery_queue: 'id', meta: 'key',
      key_envelopes: 'userId', pin_attempts: 'userId', device_keys: 'id' });
    await db.open();
    const ciphertext = new Uint8Array(35).fill(255); ciphertext[0] = 1;
    await db.table('records').add({ userId: 'alice', kind: 'sale', id: 'pending', ciphertext });
    await db.table('delivery_queue').add({ id: 'pending',
      envelope: new TextEncoder().encode(JSON.stringify({ version, keyId: 'historical-key', ciphertext: 'opaque' })) });
    db.close();
    return this.snapshot();
  },
  async snapshot() {
    const db = new Dexie(name); await db.open();
    try { return { version: db.verno,
      records: (await db.table('records').toArray()).map(row => Array.from(row.ciphertext)),
      pending: (await db.table('delivery_queue').toArray()).map(row => Array.from(row.envelope)) }; }
    finally { db.close(); }
  },
  migrate: prepareOfflineUpdate,
};
document.getElementById('status').textContent = 'Listo';
</script></body></html>
