global:
  scrape_interval: 1m
  evaluation_interval: 1m
rule_files:
  - /etc/prometheus/operations-alerts.yaml
  - /etc/prometheus/inventory-ledger-alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']
  - job_name: api-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api:3000/api/v1/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
