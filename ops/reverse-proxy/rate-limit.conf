# Imported by the production reverse proxy. Authentication endpoints also use
# persistent PostgreSQL limits inside the API; this is the coarse global edge limit.
limit_req_zone $binary_remote_addr zone=uconext_api_general:10m rate=20r/s;

location /api/ {
  limit_req zone=uconext_api_general burst=40 nodelay;
  proxy_pass http://uconext_api;
}
